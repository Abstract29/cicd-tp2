name: CI - Tests Automatisés avec IA
on:
  push:
    branches: ["*"]

jobs:
  setup_and_build:
    name: Setup et Génération (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Python et cache Pip
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Mise à jour et installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération des tests Pytest à partir du Gherkin
        run: python ai_tools/test_generator.py

      - name: Upload des sources et des tests générés
        uses: actions/upload-artifact@v4
        with:
          # On archive tous les fichiers nécessaires pour le test
          name: python-sources-${{ matrix.python-version }}
          path: |
            .
            !reports
            !screenshots
            !venv
          retention-days: 1

  run_tests:
    name: Exécution des Tests (${{ needs.setup_and_build.outputs.python-version }})
    runs-on: ubuntu-latest
    needs: setup_and_build

    # Utilise la matrice de l'étape précédente
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup_and_build.outputs.python-versions) }}

    steps:
      # Récupération des fichiers du job précédent
      - name: Download des sources et des tests générés
        uses: actions/download-artifact@v4
        with:
          name: python-sources-${{ matrix.python-version }}
          path: .

      - name: Exécution des tests générés
        run: python -m pytest tests/generated/ -v

      - name: Installation de Chrome pour les tests visuels
        uses: browser-actions/setup-chrome@latest

      - name: Exécution des tests visuels/E2E
        run: python -m pytest tests/visual/ -v
        continue-on-error: true

      - name: Exécution complète et collecte des résultats Allure/HTML
        run: |
          python -m pytest tests/ -v \
            --html=reports/full-report.html --self-contained-html \
            --alluredir=reports/allure-results
        continue-on-error: true

      # --- Sauvegarde des Rapports pour l'étape suivante ---
      - name: Upload des résultats de tests (Rapports et Screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            reports/
            screenshots/
          retention-days: 30

  reporting_and_upload:
    name: Génération et Upload des Rapports
    runs-on: ubuntu-latest
    needs: run_tests

    steps:
      - name: Download de tous les résultats de tests
        uses: actions/download-artifact@v3
        with:
          name: test-results-3.11
          path: reports/

      - name: Installation d'Allure CLI
        run: npm install -g allure-commandline

      - name: Génération du rapport HTML Allure
        run: allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload du Rapport Allure Final
        uses: actions/upload-artifact@v4
        with:
          name: rapport-final-allure
          path: reports/allure-report
          retention-days: 30